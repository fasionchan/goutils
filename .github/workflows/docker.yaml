name: Build Changed Images
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.changes }}   # 例如 ["api","web"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 跨 push 比较需要历史
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            devteam:
              - 'docker/devteam/**'

  build:
    needs: detect
    if: ${{ needs.detect.outputs.images != '[]' && needs.detect.outputs.images != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.image }}-latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.image }}-${{ github.sha }},enable={{is_default_branch}}
            type=semver,pattern=${{ matrix.image }}-{{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern=${{ matrix.image }}-{{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max